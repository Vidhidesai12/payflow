[project]
name = "analytics-mcp"
version = "0.1.0"
description = "Read-only MCP server with ledger analytics for PayFlow (statements, volumes, unusual activity)."
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.3.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
