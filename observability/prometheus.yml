# Prometheus pulls ("scrapes") metrics from each service every 5 seconds.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8080"]
  - job_name: ledger-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ledger-service:8081"]
  - job_name: mcp-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["mcp-server:8083"]
  - job_name: mcp-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp-gateway:8085"]
