# Local environment. Everything runs on your machine, so it costs nothing.
#
#   docker compose up -d                                  infrastructure only (run the apps from your IDE / mvnw)
#   docker compose --profile apps up -d --build           + the three services, built inside Docker
#   docker compose --profile apps --profile observability up -d --build   + Prometheus and Grafana
#   docker compose down        stop        docker compose down -v        stop and wipe all data
#
# All credentials below are local-only demo values; never reuse them anywhere real.

services:
  # payment-service's database
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      # Host port 15432, not 5432, so it can't clash with a PostgreSQL installed on your machine.
      - "${PAYFLOW_DB_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 5s
      retries: 10

  # ledger-service's own database: services never share tables.
  ledger-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "${LEDGER_DB_PORT:-15433}:5432"
    volumes:
      - ledgerdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      retries: 10

  # Single Kafka broker in KRaft mode (no ZooKeeper).
  # Two listeners: localhost:9092 for apps on your machine, kafka:29092 for apps inside Docker.
  kafka:
    image: apache/kafka:4.2.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 12

  # ---- the services (profile: apps) ----------------------------------------------

  fraud-service:
    profiles: [apps]
    build:
      context: .
      args:
        SERVICE: fraud-service
    ports:
      - "8082:8082"

  ledger-service:
    profiles: [apps]
    build:
      context: .
      args:
        SERVICE: ledger-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ledger-db:5432/ledger
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      ledger-db: { condition: service_healthy }
      kafka: { condition: service_healthy }

  payment-service:
    profiles: [apps]
    build:
      context: .
      args:
        SERVICE: payment-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payflow
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYFLOW_FRAUD_BASE_URL: http://fraud-service:8082
      PAYFLOW_LEDGER_BASE_URL: http://ledger-service:8081
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      fraud-service: { condition: service_started }
      ledger-service: { condition: service_started }

  # ---- metrics (profile: observability) ------------------------------------------

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.16.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.6
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  ledgerdata:
  kafkadata:
