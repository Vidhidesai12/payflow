# Free on public GitHub repos. Docker is preinstalled on ubuntu-latest, so Testcontainers just works.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false            # one service failing shouldn't hide the others' results
      matrix:
        service: [payment-service, ledger-service, fraud-service, mcp-server]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify -pl ${{ matrix.service }}
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-test-reports
          path: ${{ matrix.service }}/target/surefire-reports

  analytics-mcp:
    name: analytics-mcp (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: analytics-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: analytics-mcp/pyproject.toml
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        run: pytest -q

  mcp-gateway:
    name: mcp-gateway (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp-gateway/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check (source and tests)
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: No known vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [test, analytics-mcp, mcp-gateway]
    steps:
      - uses: actions/checkout@v7
      - name: Build all service images
        run: docker compose --profile apps build
