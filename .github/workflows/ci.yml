# Free on public GitHub repos. Docker is preinstalled on ubuntu-latest, so Testcontainers just works.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false            # one service failing shouldn't hide the others' results
      matrix:
        service: [payment-service, ledger-service, fraud-service, mcp-server]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify -pl ${{ matrix.service }}
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-test-reports
          path: ${{ matrix.service }}/target/surefire-reports

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build all service images
        run: docker compose --profile apps build
